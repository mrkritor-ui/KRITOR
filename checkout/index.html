<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Content-Security-Policy, on this page only.

     The card fields are inside a Stripe iframe, so a script running here can
     never read a card number — the browser already prevents that. What this
     stops is the attack that does not need to: a script injected into this
     page painting a convincing fake card form over the real one and posting
     what gets typed to its own server. connect-src is the directive doing that
     work, and script-src keeps a foreign script from being loaded to begin
     with.

     It has to be a meta tag because GitHub Pages cannot send headers, which
     costs two things: frame-ancestors does not apply in meta form, so this is
     not clickjacking protection, and Report-Only is header-only, so the policy
     could not be staged in warning mode first.

     'unsafe-inline' stays in style-src because Stripe injects its own styles
     into the page and the Elements will not render without it. It is
     deliberately NOT in script-src: allowing inline script would let an
     injected <script> run and make the rest of this close to decorative. That
     is why the two inline handlers this page used to carry — the font swap
     below and the thumbnail fallback in checkout.js and cart.js — were moved
     into those files.

     maps.googleapis.com is for the Address Element's autocomplete. The worker
     origin is named literally, so changing paymentApiBase in store-config.js
     means changing it here too or the checkout cannot reach it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://js.stripe.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com; connect-src 'self' https://api.stripe.com https://*.stripe.com https://*.stripe.network https://maps.googleapis.com https://kritor-payments.kritor.workers.dev; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.stripe.network">
<title>Checkout — KRITOR</title>
<script src="/theme-boot.js?v=1"></script>
<link rel="canonical" href="/checkout/">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded async: media="print" keeps it out of the critical path, so a slow
     or blocked font host can never delay rendering or script execution.
     checkout.js switches the media back to "all"; that used to be an inline
     onload attribute here, which the policy above will not run. -->
<link id="font-css" rel="stylesheet" media="print"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Jacquarda+Bastarda+9&amp;display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Jacquarda+Bastarda+9&amp;display=swap"></noscript>
<link rel="stylesheet" href="/type.css?v=3">
<link rel="stylesheet" href="/checkout.css?v=3">
<link rel="stylesheet" href="/checkout-terminal.css?v=1">
<link rel="stylesheet" href="/cursor.css?v=1">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header class="checkout-header">
  <a class="checkout-back" href="/store/" aria-label="Back to store">+</a>
  <a class="checkout-mark" href="/">KRITOR</a>
</header>

<main class="checkout" id="checkout">

  <!-- 1. The bag itself, editable in place. This page IS the bag — there is no
          separate bag step to pass through. -->
  <section class="order">
    <h1 class="section-head">Order Summary</h1>
    <div class="order-lines" id="summary-lines"></div>
    <dl class="order-totals" id="summary-totals"></dl>
  </section>

  <div class="checkout-notice" id="checkout-notice" hidden></div>

  <div id="checkout-body" hidden>

    <!-- 2. One tap and done, for anyone with a wallet. -->
    <section class="express" id="express-block" hidden>
      <div id="express-element"></div>
      <p class="express-hint">Or continue below</p>
    </section>

    <!-- 3. Everything else, on the same scroll. -->
    <form id="payment-form" novalidate>
      <section class="block">
        <h2 class="section-head">Contact</h2>
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </label>
      </section>

      <section class="block">
        <h2 class="section-head">Shipping</h2>
        <div id="address-element"></div>
      </section>

      <section class="block">
        <h2 class="section-head">Payment</h2>
        <div id="payment-element"></div>
      </section>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button class="pay-button" id="pay-button" type="submit" disabled>
        <span id="pay-label">Submit Order</span>
      </button>

      <p class="fineprint">
        Payment is processed by Stripe. KRITOR never sees your card details.
      </p>
    </form>
  </div>
</main>

<section class="checkout-done" id="checkout-done" hidden>
  <div class="done-inner">
    <h1>Thank you</h1>
    <p id="done-detail"></p>
    <a class="done-link" href="/store/">Return to store</a>
  </div>
</section>

<script src="/products.js?v=1"></script>
<script src="/image-manifest.js"></script>
<script src="/tile-image.js?v=1"></script>
<script src="/cart.js?v=4"></script>
<script src="/store-config.js?v=1"></script>
<script src="/checkout.js?v=6"></script>
</body>
</html>
