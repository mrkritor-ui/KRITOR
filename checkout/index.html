<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — KRITOR</title>
<link rel="canonical" href="/checkout/">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded async: media="print" keeps it out of the critical path, so a slow
     or blocked font host can never delay rendering or script execution. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap"></noscript>
<link rel="stylesheet" href="/type.css?v=3">
<link rel="stylesheet" href="/checkout.css?v=3">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header class="checkout-header">
  <a class="checkout-back" href="/store/" aria-label="Back to store">+</a>
  <a class="checkout-mark" href="/">KRITOR</a>
</header>

<main class="checkout" id="checkout">

  <!-- 1. The bag itself, editable in place. This page IS the bag — there is no
          separate bag step to pass through. -->
  <section class="order">
    <h1 class="section-head">Order Summary</h1>
    <div class="order-lines" id="summary-lines"></div>
    <dl class="order-totals" id="summary-totals"></dl>
  </section>

  <div class="checkout-notice" id="checkout-notice" hidden></div>

  <div id="checkout-body" hidden>

    <!-- 2. One tap and done, for anyone with a wallet. -->
    <section class="express" id="express-block" hidden>
      <div id="express-element"></div>
      <p class="express-hint">Or continue below</p>
    </section>

    <!-- 3. Everything else, on the same scroll. -->
    <form id="payment-form" novalidate>
      <section class="block">
        <h2 class="section-head">Contact</h2>
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </label>
      </section>

      <section class="block">
        <h2 class="section-head">Shipping</h2>
        <div id="address-element"></div>
      </section>

      <section class="block">
        <h2 class="section-head">Payment</h2>
        <div id="payment-element"></div>
      </section>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button class="pay-button" id="pay-button" type="submit" disabled>
        <span id="pay-label">Submit Order</span>
      </button>

      <p class="fineprint">
        Payment is processed by Stripe. KRITOR never sees your card details.
      </p>
    </form>
  </div>
</main>

<section class="checkout-done" id="checkout-done" hidden>
  <div class="done-inner">
    <h1>Thank you</h1>
    <p id="done-detail"></p>
    <a class="done-link" href="/store/">Return to store</a>
  </div>
</section>

<script src="/products.js"></script>
<script src="/image-manifest.js"></script>
<script src="/tile-image.js?v=1"></script>
<script src="/cart.js?v=3"></script>
<script src="/store-config.js"></script>
<script src="/checkout.js?v=3"></script>
</body>
</html>
