<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — KRITOR</title>
<link rel="canonical" href="/checkout/">
<meta name="theme-color" content="#f1f0ee">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/checkout.css">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header class="checkout-header">
  <a class="checkout-back" href="/store/" aria-label="Back to store">+</a>
  <a class="checkout-mark" href="/">KRITOR</a>
</header>

<main class="checkout" id="checkout">
  <section class="checkout-pane checkout-form-pane">
    <h1 class="checkout-title">Checkout</h1>

    <div class="checkout-notice" id="checkout-notice" hidden></div>

    <div id="checkout-body" hidden>
      <!-- Apple Pay / Google Pay sit above the fold; this is the whole point
           of the embedded flow for phone users. -->
      <div class="express-block" id="express-block" hidden>
        <div id="express-element"></div>
        <div class="express-divider"><span>or pay by card</span></div>
      </div>

      <form id="payment-form" novalidate>
        <fieldset class="field-block">
          <legend>Contact</legend>
          <label class="field">
            <span class="field-label">Email</span>
            <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
          </label>
        </fieldset>

        <fieldset class="field-block">
          <legend>Shipping</legend>
          <div id="address-element"></div>
        </fieldset>

        <fieldset class="field-block">
          <legend>Payment</legend>
          <div id="payment-element"></div>
        </fieldset>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <button class="pay-button" id="pay-button" type="submit" disabled>
          <span id="pay-label">Pay</span>
        </button>

        <p class="checkout-fineprint">
          By placing this order you agree to the terms of sale. Payment is
          processed by Stripe — KRITOR never sees your card details.
        </p>
      </form>
    </div>
  </section>

  <aside class="checkout-pane checkout-summary-pane">
    <h2 class="summary-title">Order</h2>
    <div class="summary-lines" id="summary-lines"></div>
    <dl class="summary-totals" id="summary-totals"></dl>
    <a class="summary-edit" href="/store/">Continue shopping</a>
  </aside>
</main>

<section class="checkout-done" id="checkout-done" hidden>
  <div class="done-inner">
    <h1>Thank you</h1>
    <p id="done-detail"></p>
    <a class="done-link" href="/store/">Return to store</a>
  </div>
</section>

<script src="/products.js"></script>
<script src="/cart.js"></script>
<script src="/store-config.js"></script>
<script src="/checkout.js"></script>
</body>
</html>
