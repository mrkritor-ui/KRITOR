<!doctype html>
<html lang="en" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Store — KRITOR</title>
  <link rel="canonical" href="/store/">
  <link rel="manifest" href="../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="../icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded async: media="print" keeps it out of the critical path, so a slow
       or blocked font host can never delay rendering or script execution. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"></noscript>

  <link rel="stylesheet" href="../terminal.css?v=2">
  <script>
    /* Applied before first paint: booting light and repainting dark is a white
       flash on every load for anyone who chose the terminal. */
    try {
      var t = localStorage.getItem("kritor-theme");
      if (t === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
</head>
<body>

  <div class="boot" id="boot">

    <div class="bar-row" id="info-row" hidden>
      <button class="bar-btn" id="info-btn" type="button" aria-pressed="false"><svg class="ico" viewBox="0 0 7 7" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg> INFO</button>

    </div>

    <div class="bar-loading" id="loading-row">
      <span class="bar-loading-label" id="loading-label">LOADING</span>
      <div class="bar-progress"><span id="loading-fill"></span></div>
    </div>

    <div class="bar-drawer" id="drawer">
      <div class="filters" id="filters-pane"></div>
      <div class="info-pane" id="info-pane" hidden>
        <p>ORIGINAL WORK AND EDITIONS, SOLD DIRECTLY BY THE ARTIST. EACH PIECE SHIPS FROM MELBOURNE, PACKED FLAT OR ROLLED DEPENDING ON SIZE.</p>
        <p>CONTACT: <a href="mailto:info@kritor.au">INFO@KRITOR.AU</a></p>
