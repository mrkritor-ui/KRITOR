<!-- Loaded async: media="print" keeps it out of the critical path, so a slow
     or blocked font host can never delay rendering or script execution. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap">

<body>
<header class="work-header"><a href="/?return=catalogue" aria-label="Back to catalogue">+</a></header>
<main id="work-page"></main>
<script src="artworks.js"></script><script src="/image-manifest.js"></script><script src="/tile-image.js?v=1"></script><script src="work.js?v=2"></script>
<script>
(function(){
  const id=new URLSearchParams(location.search).get('id');
  if(id && /^work-[A-Za-z0-9_-]+$/.test(id)){
    history.replaceState(history.state,'','/' + encodeURIComponent(id) + '/');
    document.querySelectorAll('a[href*="work.html?id="]').forEach(function(a){
      const u=new URL(a.href,location.href),rid=u.searchParams.get('id');
      if(rid)a.href='/' + encodeURIComponent(rid) + '/';
    });
  }
})();
</script>
</body></html>
