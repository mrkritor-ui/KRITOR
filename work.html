<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>KRITOR</title>
<link rel="canonical" href="/">
<!-- The site face, served from this origin. Preloaded rather than left to
     the stylesheet to discover: it is 4 KB, and font-display: block means
     nothing is painted in it until it lands. -->
<link rel="preload" href="/fonts/pix-chicago.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="script" href="/artworks.js">
<link rel="preload" as="script" href="/work.js?v=3">
<link rel="stylesheet" href="/type.css?v=__ASSET_VERSION__">
<link rel="stylesheet" href="/work.css?v=5">
<link rel="stylesheet" href="/zoom.css?v=4">
<script src="/zoom-transition.js?v=3"></script>
<!-- The drawn cursor. cursor.css asks the browser for it; cursor.js draws
     it, which is the half that cannot be silently declined. -->
<link rel="stylesheet" href="/cursor.css?v=__ASSET_VERSION__">
<script src="/cursor.js?v=__ASSET_VERSION__" defer></script>
</head>
<body>
<header class="work-header"><a href="/?return=catalogue" aria-label="Back to catalogue">+</a></header>
<main id="work-page"></main>
<script src="/artworks.js"></script><script src="/image-manifest.js"></script><script src="/tile-image.js?v=1"></script><script src="/work.js?v=3"></script>
<script>
(function(){
  const id=new URLSearchParams(location.search).get('id');
  if(id && /^work-[A-Za-z0-9_-]+$/.test(id)){
    history.replaceState(history.state,'','/' + encodeURIComponent(id) + '/');
    document.querySelectorAll('a[href*="work.html?id="]').forEach(function(a){
      const u=new URL(a.href,location.href),rid=u.searchParams.get('id');
      if(rid)a.href='/' + encodeURIComponent(rid) + '/';
    });
  }
})();
</script>
</body></html>
