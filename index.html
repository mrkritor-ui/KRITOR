<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KRITOR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <script>if(new URLSearchParams(location.search).get('return')==='catalogue')document.documentElement.classList.add('return-catalog');</script>
  <style>.return-catalog #glass-intro{display:none!important;pointer-events:none!important}</style>
</head>
<body>
  <header class="site-header" aria-label="KRITOR navigation">
    <button id="zoom-control" class="zoom-control" type="button" aria-label="Catalogue view: normal. Tap to change view">+</button>
    <a class="about-link" href="about.html">About</a>
  </header>
  <main id="grid" class="grid" aria-label="Artwork catalogue"></main>
  <div id="glass-intro" class="glass-intro" aria-label="Enter KRITOR catalogue">
    <div class="glass-logo">KRITOR</div>
  </div>
  <script src="artworks.js"></script>
  <script src="script.js"></script>
  <script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
