<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KRITOR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <script>(function(){var p=new URLSearchParams(location.search);if(p.get('return')==='catalogue'||localStorage.getItem('kritor_intro_seen')==='1')document.documentElement.classList.add('skip-intro')})()</script>
  <style>.skip-intro #glass-intro{display:none!important;pointer-events:none!important}</style>
</head>
<body>
  <header class="site-header" aria-label="KRITOR navigation">
    <div class="catalog-controls">
      <button id="zoom-control" class="zoom-control" type="button" aria-label="Catalogue view: normal. Tap to change view">+</button>
      <button id="shuffle-control" class="shuffle-control" type="button" aria-label="Shuffle artwork order" title="Shuffle artwork order">↻</button>
    </div>
    <a class="about-link" href="about.html">About</a>
  </header>
  <main id="grid" class="grid" aria-label="Artwork catalogue"></main>
  <div id="glass-intro" class="glass-intro" aria-label="Enter KRITOR catalogue">
    <div class="glass-noise" aria-hidden="true"></div>
    <div class="glass-refraction" aria-hidden="true"></div>
    <div class="glass-overlay" aria-hidden="true"></div>
  </div>
  <script src="artworks.js"></script>
  <script src="script.js"></script>
  <script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
