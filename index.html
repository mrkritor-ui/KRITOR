<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KRITOR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css?v=12" data-kritor-page-style>
  <link rel="stylesheet" href="transitions.css?v=11">
  <script src="spa-transition.js?v=2"></script>
  <style>
    #kritor-gif-overlay{position:fixed;inset:0;z-index:99998;display:grid;place-items:center;pointer-events:none;opacity:1;transition:opacity 1.5s cubic-bezier(.22,.61,.36,1);will-change:opacity}
    #kritor-gif-overlay img{display:block;width:min(72vw,760px);height:auto;max-width:90vw;max-height:55vh;object-fit:contain}
    #kritor-gif-overlay.is-fading{opacity:0}
    #kritor-gif-overlay.is-hidden{display:none}
    #kritor-gif-overlay.returned{position:fixed;inset:auto;display:block;top:10px;left:86px;width:90px;height:84px;opacity:1;transition:none;z-index:100002}
    #kritor-gif-overlay.returned img{width:90px;height:84px;max-width:none;max-height:none;object-fit:contain}
    @media(max-width:699px){#kritor-gif-overlay img{width:min(84vw,600px)}#kritor-gif-overlay.returned{left:70px;top:8px;width:84px;height:84px}#kritor-gif-overlay.returned img{width:84px;height:84px}}
  </style>
</head>
<body>
  <header class="site-header" aria-label="KRITOR navigation">
    <div class="catalog-controls">
      <button id="zoom-control" class="zoom-control" type="button" aria-label="Catalogue view: normal. Tap to change view">+</button>
      <button id="shuffle-control" class="shuffle-control" type="button" aria-label="Shuffle artwork order" title="Shuffle artwork order">↻</button>
    </div>
    <a class="about-link" href="about.html">About</a>
  </header>

  <main id="grid" class="grid" aria-label="Artwork catalogue"></main>

  <div id="kritor-gif-overlay" aria-hidden="true">
    <img src="images/_3dtext2gif_wcyfjsy_pjqbbag KRITOR GIF.gif" alt="">
  </div>

  <script src="artworks.js"></script>
  <script src="script.js?v=4"></script>
  <script>
    (() => {
      const overlay = document.getElementById('kritor-gif-overlay');
      const about = document.querySelector('.about-link');
      let dismissed = false;
      const returnedFromAbout = sessionStorage.getItem('kritor-return-from-about') === '1';
      sessionStorage.removeItem('kritor-return-from-about');
      if (returnedFromAbout) {
        overlay.classList.add('returned');
      } else {
        const dismiss = () => {
          if (dismissed) return;
          dismissed = true;
          overlay.classList.add('is-fading');
          window.setTimeout(() => overlay.classList.add('is-hidden'), 1550);
          window.removeEventListener('pointerdown', dismiss);
          window.removeEventListener('wheel', dismiss);
          window.removeEventListener('touchmove', dismiss);
          window.removeEventListener('keydown', dismiss);
        };
        window.addEventListener('pointerdown', dismiss, { passive: true });
        window.addEventListener('wheel', dismiss, { passive: true });
        window.addEventListener('touchmove', dismiss, { passive: true });
        window.addEventListener('keydown', dismiss, { passive: true });
      }
      if (about) about.addEventListener('click', () => sessionStorage.setItem('kritor-return-from-about', '1'));
    })();
  </script>
  <script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
