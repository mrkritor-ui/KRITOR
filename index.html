<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KRITOR</title>
  <link rel="canonical" href="/">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded async: media="print" keeps it out of the critical path, so a slow
       or blocked font host can never delay rendering or script execution. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap"></noscript>
  <link rel="stylesheet" href="type.css?v=3">
  <link rel="stylesheet" href="style.css?v=14" data-kritor-page-style>
  <link rel="stylesheet" href="zoom.css?v=2">
  <link rel="stylesheet" href="transitions.css?v=11">
  <script src="zoom-transition.js?v=2"></script>
  <script src="spa-transition.js?v=5"></script>
  <script>window.__kritorReturnWork=new URLSearchParams(location.search).get('work');if(window.__kritorReturnWork)document.documentElement.classList.add('returning-artwork');</script>
  <style>
    /* Sits in the header's centre grid track — see .site-header in style.css.
       Being a grid item is what stops it colliding: tracks cannot overlap. */
    #kritor-top-logo{justify-self:center;width:min(120px,22vw);max-width:100%;height:auto;display:block;opacity:0;pointer-events:none;transition:opacity .8s cubic-bezier(.22,.61,.36,1);will-change:opacity}
    #kritor-top-logo.is-visible{opacity:1}
  </style>
</head>
<body>
  <header class="site-header" aria-label="KRITOR navigation">
    <div class="catalog-controls">
      <button id="zoom-control" class="zoom-control" type="button" aria-label="Catalogue view: normal. Tap to change view">+</button>
      <button id="shuffle-control" class="shuffle-control" type="button" aria-label="Shuffle artwork order" title="Shuffle artwork order">↻</button>
      <a class="nav-link nav-link-inline" href="/store/">Store</a>
    </div>
    <img id="kritor-top-logo" src="/images/kritor%20top%20text.png" alt="KRITOR">
    <nav class="site-nav">
      <a class="nav-link" href="/about/">About</a>
    </nav>
  </header>
  <main id="grid" class="grid" aria-label="Artwork catalogue"></main>
  <script src="artworks.js"></script>
  <script src="image-manifest.js"></script>
  <script src="tile-image.js?v=1"></script>
  <script src="script.js?v=8"></script>
  <script src="clean-work-links.js?v=1"></script>
  <script>
    if(window.__kritorReturnWork){const tile=document.querySelector('.tile[data-work-id="'+CSS.escape(window.__kritorReturnWork)+'"]');if(tile)tile.style.viewTransitionName='returning-artwork';}
  </script>
  <script>
    (function(){
      const logo=document.getElementById('kritor-top-logo');
      if(!logo)return;
      let revealed=false;
      const reveal=()=>{
        if(revealed)return;
        revealed=true;
        logo.classList.add('is-visible');
        ['scroll','pointerdown','pointermove','keydown','wheel','touchstart'].forEach(type=>window.removeEventListener(type,reveal));
      };
      ['scroll','pointerdown','pointermove','keydown','wheel','touchstart'].forEach(type=>window.addEventListener(type,reveal,{passive:true}));
    })();
  </script>
  <script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
