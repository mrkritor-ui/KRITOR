<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KRITOR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css?v=12" data-kritor-page-style>
  <link rel="stylesheet" href="transitions.css?v=11">
  <script src="spa-transition.js?v=3"></script>
  <script>window.__kritorReturnWork=new URLSearchParams(location.search).get('work');if(window.__kritorReturnWork)document.documentElement.classList.add('returning-artwork');</script>
  <style>
    #kritor-gif-overlay{position:fixed;inset:0;z-index:99998;display:grid;place-items:center;pointer-events:none;opacity:1;transition:opacity 1.5s cubic-bezier(.22,.61,.36,1);will-change:opacity}
    #kritor-gif-overlay img{display:block;width:min(72vw,760px);height:auto;max-width:90vw;max-height:55vh;object-fit:contain}
    #kritor-gif-overlay.is-fading{opacity:0}
    #kritor-gif-overlay.is-hidden{display:none}
  </style>
</head>
<body>
  <header class="site-header" aria-label="KRITOR navigation">
    <div class="catalog-controls">
      <button id="zoom-control" class="zoom-control" type="button" aria-label="Catalogue view: normal. Tap to change view">+</button>
      <button id="shuffle-control" class="shuffle-control" type="button" aria-label="Shuffle artwork order" title="Shuffle artwork order">↻</button>
    </div>
    <a class="about-link" href="about.html">About</a>
  </header>

  <main id="grid" class="grid" aria-label="Artwork catalogue"></main>

  <div id="kritor-gif-overlay" aria-hidden="true">
    <img src="images/_3dtext2gif_wcyfjsy_pjqbbag KRITOR GIF.gif" alt="">
  </div>

  <script src="artworks.js"></script>
  <script src="script.js?v=7"></script>
  <script>
    if(window.__kritorReturnWork){
      const tile=document.querySelector('.tile[data-work-id="'+CSS.escape(window.__kritorReturnWork)+'"]');
      if(tile)tile.style.viewTransitionName='returning-artwork';
    }
  </script>
  <script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
