<!doctype html>
<html lang="en" data-theme="light" data-page="landing">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KRITOR</title>
  <link rel="canonical" href="/">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="KRITOR">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/icon.png">

  <!-- The site face, served from this origin. Preloaded rather than left to
       the stylesheet to discover: it is 4 KB, and font-display: block means
       nothing is painted in it until it lands. -->
  <link rel="preload" href="/fonts/pix-chicago.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/type.css?v=__ASSET_VERSION__">
  <!-- The same panel every other page uses, so the door and the rooms behind
       it read as one system. Nothing here draws the boot's storm or the
       store's starfield: this screen has no scene, only the bar. -->
  <link rel="stylesheet" href="/terminal.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/landing.css?v=__ASSET_VERSION__">
  <!-- The drawn cursor. cursor.css asks the browser for it; cursor.js draws
       it, which is the half that cannot be silently declined. -->
  <link rel="stylesheet" href="/cursor.css?v=__ASSET_VERSION__">
  <script src="/cursor.js?v=__ASSET_VERSION__" defer></script>
  <script src="/theme-boot.js?v=__ASSET_VERSION__"></script>
</head>
<body>

  <!-- Empty on purpose. Nothing arrives here until something is chosen. -->
  <main class="landing" id="landing"></main>

  <div class="bar bar-landing" id="bar">
    <div class="bar-row" id="menu-options">
      <a class="bar-btn" href="/art/" data-nav="/art/">ART</a>
      <a class="bar-btn" href="/architecture/" data-nav="/architecture/">ARCHITECTURE</a>
      <a class="bar-btn" href="/store/" data-nav="/store/">STORE</a>
    </div>

    <!-- Already in the bar's own slot, the way every loading row on this site
         is: it does not travel here, it is simply what is in this panel once
         something has been chosen. -->
    <div class="bar-loading" id="loading-row" hidden>
      <span class="bar-loading-label" id="loading-label" aria-live="polite">LOADING</span>
      <div class="bar-progress"><span id="loading-fill"></span></div>
    </div>
  </div>

  <script src="/landing.js?v=__ASSET_VERSION__"></script>
  <script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}</script>
</body>
</html>
