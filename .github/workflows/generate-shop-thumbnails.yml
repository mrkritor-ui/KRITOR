name: Generate store thumbnails

on:
  push:
    branches:
      - redesign/catalogue-v2
    paths:
      - 'shop/**'
      - '.github/workflows/generate-shop-thumbnails.yml'

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/catalogue-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate WebP thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('shop')
          extensions = {'.jpg', '.jpeg', '.png', '.JPG', '.JPEG', '.PNG'}

          # One folder per shop item; thumbs live alongside the originals.
          for item in sorted(p for p in root.iterdir() if p.is_dir()):
              output = item / 'thumbs'
              sources = [p for p in item.iterdir()
                         if p.is_file() and p.suffix in extensions]
              if not sources:
                  continue
              output.mkdir(exist_ok=True)
              for path in sources:
                  target = output / f'{path.stem}.webp'
                  if target.exists() and target.stat().st_mtime >= path.stat().st_mtime:
                      continue
                  with Image.open(path) as im:
                      im = im.convert('RGB')
                      im.thumbnail((1000, 1000), Image.Resampling.LANCZOS)
                      im.save(target, 'WEBP', quality=82, method=6)
                      print(f'{path} -> {target}')
          PY

      - name: Commit generated thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop
          git diff --cached --quiet || git commit -m 'Generate optimized store thumbnails'
          git push
