name: Generate catalogue thumbnails

on:
  push:
    branches:
      - redesign/catalogue-v2
    paths:
      - 'images/**'
      - '.github/workflows/generate-thumbnails.yml'

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/catalogue-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate WebP thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('images')
          output = source / 'thumbs'
          output.mkdir(exist_ok=True)

          extensions = {'.jpg', '.jpeg', '.png', '.JPG', '.JPEG', '.PNG'}
          for path in source.iterdir():
              if path.is_file() and path.suffix in extensions:
                  with Image.open(path) as im:
                      im = im.convert('RGB')
                      im.thumbnail((1000, 1000), Image.Resampling.LANCZOS)
                      target = output / f'{path.stem}.webp'
                      im.save(target, 'WEBP', quality=82, method=6)
          PY

      - name: Commit generated thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/thumbs
          git diff --cached --quiet || git commit -m 'Generate optimized catalogue thumbnails'
          git push
