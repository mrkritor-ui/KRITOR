name: Generate AR assets

on:
  push:
    branches:
      - redesign/catalogue-v2
    paths:
      # The AR texture now comes from the artwork's own catalogue image, so a
      # new work in images/ is enough to produce its AR file.
      - "images/**"
      - "artworks.js"
      - "scripts/**"
      - ".github/workflows/generate-ar.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: redesign/catalogue-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install USD
        run: |
          python -m pip install --upgrade pip
          pip install usd-core pillow

      - name: Generate USDZ files
        run: |
          python scripts/generate_usdz.py

      # Runs even when generation reported a problem, so the works that did
      # build are not lost — the job still fails, so the problem is visible.
      - name: Commit generated AR assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ar/

          if git diff --cached --quiet; then
            echo "No AR changes."
            exit 0
          fi

          git commit -m "Generate AR assets"
          git fetch origin redesign/catalogue-v2
          git rebase origin/redesign/catalogue-v2
          git push origin HEAD:redesign/catalogue-v2
