name: Deploy Website

on:
  push:
    # The default branch is the live site, and there is only one of each. This
    # used to name the terminal redesign's own working branch, from back when
    # redesign/catalogue-v2 held the old catalogue and the two were publishing
    # to the same Pages site — but the redesign has since been folded into
    # redesign/catalogue-v2, that working branch is gone, and a trigger on a
    # branch that no longer exists is a site that quietly stops deploying.
    # Nothing was lost in the fold: the old catalogue's head (419c1bc) is an
    # ancestor of this branch, so it is still in this history.
    #
    # Both names are listed because the default branch is mid-rename to main.
    # Renaming it is one action in the repository's settings and it cannot be
    # done from in here, so this file has to be correct whether that has
    # happened yet or not — a trigger that is only right after somebody
    # remembers to click something is the same silent failure as the one
    # above. Drop redesign/catalogue-v2 from this list once the rename is
    # through and the old name is gone.
    branches:
      - main
      - redesign/catalogue-v2
  workflow_dispatch:

concurrency:
  group: pages-v2
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build version
        run: |
          VERSION="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD_VERSION__/$VERSION/g" sw.js
          # Same stamp on every asset URL. Hand-numbered ?v=1 strings meant a
          # deploy could change a file and nobody would ever be served it.
          grep -rl __ASSET_VERSION__ --include='*.html' . \
            | xargs -r sed -i "s/__ASSET_VERSION__/$VERSION/g"
          echo "$VERSION" > version.txt

      # Every work and every shop item gets a real page at its clean URL.
      # These used to be redirect stubs, but a redirect breaks the view
      # transition between the grid and the item — the browser cannot animate
      # across an extra navigation — so the page itself is written there.
      # Both files reference everything root-absolutely, so one copy works at
      # any depth.
      - name: Build store routes and catalogue
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { SHOP_ITEMS } = require('./products.js');

          if (!Array.isArray(SHOP_ITEMS)) {
            throw new Error('products.js did not export SHOP_ITEMS');
          }

          const SITE = 'https://kritor.au';

          function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, c => (
              { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
          }

          // Defends the </script> boundary of an inlined JSON-LD block against
          // any field value that happens to contain it — none do today, but a
          // title or description is free text an artist can edit.
          function ldJson(data) {
            return JSON.stringify(data).replace(/<\//g, '<\\/');
          }

          const seen = new Set();
          for (const item of SHOP_ITEMS) {
            if (!item.id || !/^[a-z0-9][a-z0-9-]*$/.test(item.id)) {
              throw new Error(`Invalid shop item id: ${JSON.stringify(item.id)}`);
            }
            if (seen.has(item.id)) throw new Error(`Duplicate shop item id: ${item.id}`);
            seen.add(item.id);
            if (!Number.isInteger(item.price) || item.price < 0) {
              throw new Error(`${item.id}: price must be an integer in cents`);
            }
            if (!item.currency) throw new Error(`${item.id}: currency is required`);
          }

          fs.writeFileSync('products.json', JSON.stringify(SHOP_ITEMS));

          // Every generated route gets its own <title>, description, canonical,
          // Open Graph / Twitter Card tags and JSON-LD baked directly into the
          // HTML at build time — so a crawler that never runs JS (link-preview
          // bots included) still sees correct per-item metadata, not the
          // generic template every one of these pages started from.
          const productTemplate = fs.readFileSync('product.html', 'utf8');
          for (const item of SHOP_ITEMS) {
            const dir = path.join('shop', item.id);
            fs.mkdirSync(dir, { recursive: true });

            const title = `${item.title || 'KRITOR'} — KRITOR Store`;
            const bits = [item.edition, item.materials, item.size].filter(Boolean);
            const priceText = `${item.currency} ${((item.price || 0) / 100).toFixed(2)}`;
            const desc = `${item.title || 'Original work'}${bits.length ? ', ' + bits.join(', ') : ''} — ${priceText}. An original work by KRITOR, shipped from Melbourne.`;
            const canonicalUrl = `${SITE}/shop/${encodeURIComponent(item.id)}/`;
            const imagePath = (item.images || [])[0];
            const imageUrl = imagePath
              ? `${SITE}${encodeURI(imagePath.startsWith('/') ? imagePath : '/' + imagePath)}`
              : `${SITE}/icon.png`;
            const soldOut = !Number.isFinite(item.stock) ? false : item.stock < 1;

            const jsonLd = ldJson({
              '@context': 'https://schema.org',
              '@type': 'Product',
              name: item.title || 'Original work',
              image: imageUrl,
              description: desc,
              sku: item.id,
              url: canonicalUrl,
              brand: { '@type': 'Brand', name: 'KRITOR' },
              offers: {
                '@type': 'Offer',
                url: canonicalUrl,
                priceCurrency: item.currency,
                price: ((item.price || 0) / 100).toFixed(2),
                availability: soldOut ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock',
                itemCondition: 'https://schema.org/NewCondition',
              },
            });

            const head = [
              '<meta property="og:type" content="website">',
              '<meta property="og:site_name" content="KRITOR">',
              `<meta property="og:title" content="${esc(title)}">`,
              `<meta property="og:description" content="${esc(desc)}">`,
              `<meta property="og:url" content="${esc(canonicalUrl)}">`,
              `<meta property="og:image" content="${esc(imageUrl)}">`,
              '<meta name="twitter:card" content="summary_large_image">',
              `<meta name="twitter:title" content="${esc(title)}">`,
              `<meta name="twitter:description" content="${esc(desc)}">`,
              `<meta name="twitter:image" content="${esc(imageUrl)}">`,
              `<script type="application/ld+json">${jsonLd}</script>`,
            ].join('\n');

            const page = productTemplate
              .replace('<title>KRITOR</title>', `<title>${esc(title)}</title>`)
              .replace(/<meta name="description" content="[^"]*">/, `<meta name="description" content="${esc(desc)}">`)
              .replace('<link rel="canonical" href="/store/">', `<link rel="canonical" href="${esc(canonicalUrl)}">`)
              .replace('<!--SEO-HEAD-->', head);

            fs.writeFileSync(path.join(dir, 'index.html'), page);
          }

          // Work pages resolve their id from the path, so the same file serves
          // every one of them.
          const artworksSrc = fs.readFileSync('artworks.js', 'utf8');
          const artworks = JSON.parse(
            artworksSrc.slice(artworksSrc.indexOf('['), artworksSrc.lastIndexOf(']') + 1)
          );
          const workTemplate = fs.readFileSync('work.html', 'utf8');
          for (const work of artworks) {
            if (!/^work-[A-Za-z0-9_-]+$/.test(work.id)) {
              throw new Error(`Invalid artwork id: ${JSON.stringify(work.id)}`);
            }
            fs.mkdirSync(work.id, { recursive: true });

            const label = work.title && work.title.trim() && work.title !== 'Untitled'
              ? work.title
              : `Untitled — Work ${(String(work.id).match(/(\d+)/) || [])[1] || work.id}`;
            const bits = [];
            if (work.year) bits.push(work.year);
            if (work.materials) bits.push(work.materials);
            if (work.size && !/^—/.test(work.size)) bits.push(work.size);
            const desc = `${label}${bits.length ? ', ' + bits.join(', ') : ''} — an original work by KRITOR.`;
            const title = `${label} — KRITOR Art`;
            const canonicalUrl = `${SITE}/${encodeURIComponent(work.id)}/`;
            const imagePath = work.image;
            const imageUrl = imagePath
              ? `${SITE}${encodeURI(imagePath.startsWith('/') ? imagePath : '/' + imagePath)}`
              : `${SITE}/icon.png`;

            const jsonLd = ldJson(Object.assign({
              '@context': 'https://schema.org',
              '@type': 'VisualArtwork',
              name: label,
              url: canonicalUrl,
              image: imageUrl,
              creator: { '@type': 'Person', name: 'KRITOR', url: `${SITE}/` },
              isPartOf: { '@type': 'CollectionPage', name: 'Art Catalogue — KRITOR', url: `${SITE}/art/` },
            }, work.year ? { dateCreated: String(work.year) } : {}, work.materials ? { artMedium: work.materials } : {}));

            const head = [
              '<meta property="og:type" content="website">',
              '<meta property="og:site_name" content="KRITOR">',
              `<meta property="og:title" content="${esc(title)}">`,
              `<meta property="og:description" content="${esc(desc)}">`,
              `<meta property="og:url" content="${esc(canonicalUrl)}">`,
              `<meta property="og:image" content="${esc(imageUrl)}">`,
              '<meta name="twitter:card" content="summary_large_image">',
              `<meta name="twitter:title" content="${esc(title)}">`,
              `<meta name="twitter:description" content="${esc(desc)}">`,
              `<meta name="twitter:image" content="${esc(imageUrl)}">`,
              `<script type="application/ld+json">${jsonLd}</script>`,
            ].join('\n');

            const page = workTemplate
              .replace('<title>KRITOR</title>', `<title>${esc(title)}</title>`)
              .replace(/<meta name="description" content="[^"]*">/, `<meta name="description" content="${esc(desc)}">`)
              .replace('<link rel="canonical" href="/">', `<link rel="canonical" href="${esc(canonicalUrl)}">`)
              .replace('<!--SEO-HEAD-->', head);

            fs.writeFileSync(path.join(work.id, 'index.html'), page);
          }

          // sitemap.xml — every static route plus every generated work and
          // (listed, in-stock-or-not) shop route. robots.txt (checked into the
          // repo root) points crawlers at this file.
          const staticRoutes = ['/', '/about/', '/art/', '/architecture/', '/store/'];
          const workRoutes = artworks.map(w => `/${encodeURIComponent(w.id)}/`);
          const shopRoutes = SHOP_ITEMS.filter(i => !i.unlisted).map(i => `/shop/${encodeURIComponent(i.id)}/`);
          const urls = [...staticRoutes, ...workRoutes, ...shopRoutes];
          const sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n' +
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
            urls.map(u => `  <url><loc>${esc(SITE + u)}</loc></url>`).join('\n') +
            '\n</urlset>\n';
          fs.writeFileSync('sitemap.xml', sitemap);

          console.log(`Built ${SHOP_ITEMS.length} store routes, ${artworks.length} work routes, and a ${urls.length}-url sitemap`);
          JS

      # The catalogue is the landing screen, so the originals must never be what
      # a phone downloads. This builds AVIF/WebP renditions plus an inline blur
      # placeholder for every image. Built here rather than committed, so the
      # derivatives cannot drift from the originals and the repo does not carry
      # two copies of every painting.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache image renditions
        uses: actions/cache@v4
        with:
          path: derived
          # Renditions are named by a hash of their source, so a changed image
          # simply misses the cache and is rebuilt; the rest are reused.
          key: derived-${{ hashFiles('images/**', 'shop/**', 'tools/build-images.py') }}
          restore-keys: derived-

      - name: Build responsive images
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow pillow-avif-plugin numpy
          python tools/build-images.py

      # The 1-bit renditions the terminal catalogue is built from. Cheap enough
      # to rebuild every deploy — the whole catalogue is about 40 KB.
      - name: Build 1-bit renditions
        run: python tools/terminal-images.py

      # The sources in this repo are heavily commented on purpose — that is how
      # the thing explains itself — and every one of those comments was being
      # served to every visitor along with the code. Minified here so the
      # explanation stays in the repo and only the code goes on the wire:
      # roughly 423 KB of CSS and JS becomes 158 KB, and pixel-fx.js alone
      # drops from 128 KB to 31 KB, which is parse time on a phone as much as
      # it is transfer.
      #
      # Deliberately the last thing before the upload. Every step above reads
      # these files as sources — products.js is require()d, artworks.js is
      # sliced by hand in two places — and all of that wants the original.
      #
      # Identifiers are not renamed: esbuild leaves the top-level names of a
      # file it is not bundling alone, which is what keeps ARTWORKS, SHOP_ITEMS
      # and the window.Kritor* handles reachable across files.
      - name: Minify CSS and JS
        run: |
          npx --yes esbuild@0.25.0 *.js *.css --minify --outdir=.minified --log-level=error
          cp .minified/*.js .minified/*.css .
          rm -rf .minified

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
