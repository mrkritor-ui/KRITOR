name: Deploy Website

on:
  push:
    branches:
      - redesign/catalogue-v2
  workflow_dispatch:

concurrency:
  group: pages-v2
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build version
        run: |
          VERSION="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD_VERSION__/$VERSION/g" sw.js
          echo "$VERSION" > version.txt

      # Every work and every shop item gets a real page at its clean URL.
      # These used to be redirect stubs, but a redirect breaks the view
      # transition between the grid and the item — the browser cannot animate
      # across an extra navigation — so the page itself is written there.
      # Both files reference everything root-absolutely, so one copy works at
      # any depth.
      - name: Build store routes and catalogue
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { SHOP_ITEMS } = require('./products.js');

          if (!Array.isArray(SHOP_ITEMS)) {
            throw new Error('products.js did not export SHOP_ITEMS');
          }

          const seen = new Set();
          for (const item of SHOP_ITEMS) {
            if (!item.id || !/^[a-z0-9][a-z0-9-]*$/.test(item.id)) {
              throw new Error(`Invalid shop item id: ${JSON.stringify(item.id)}`);
            }
            if (seen.has(item.id)) throw new Error(`Duplicate shop item id: ${item.id}`);
            seen.add(item.id);
            if (!Number.isInteger(item.price) || item.price < 0) {
              throw new Error(`${item.id}: price must be an integer in cents`);
            }
            if (!item.currency) throw new Error(`${item.id}: currency is required`);
          }

          fs.writeFileSync('products.json', JSON.stringify(SHOP_ITEMS));

          const productPage = fs.readFileSync('product.html', 'utf8');
          for (const item of SHOP_ITEMS) {
            const dir = path.join('shop', item.id);
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, 'index.html'), productPage);
          }

          // Work pages resolve their id from the path, so the same file serves
          // every one of them.
          const artworksSrc = fs.readFileSync('artworks.js', 'utf8');
          const artworks = JSON.parse(
            artworksSrc.slice(artworksSrc.indexOf('['), artworksSrc.lastIndexOf(']') + 1)
          );
          const workPage = fs.readFileSync('work.html', 'utf8');
          for (const work of artworks) {
            if (!/^work-[A-Za-z0-9_-]+$/.test(work.id)) {
              throw new Error(`Invalid artwork id: ${JSON.stringify(work.id)}`);
            }
            fs.mkdirSync(work.id, { recursive: true });
            fs.writeFileSync(path.join(work.id, 'index.html'), workPage);
          }

          console.log(`Built ${SHOP_ITEMS.length} store routes and ${artworks.length} work routes`);
          JS

      # The catalogue is the landing screen, so the originals must never be what
      # a phone downloads. This builds AVIF/WebP renditions plus an inline blur
      # placeholder for every image. Built here rather than committed, so the
      # derivatives cannot drift from the originals and the repo does not carry
      # two copies of every painting.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache image renditions
        uses: actions/cache@v4
        with:
          path: derived
          # Renditions are named by a hash of their source, so a changed image
          # simply misses the cache and is rebuilt; the rest are reused.
          key: derived-${{ hashFiles('images/**', 'shop/**', 'tools/build-images.py') }}
          restore-keys: derived-

      - name: Build responsive images
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow pillow-avif-plugin numpy
          python tools/build-images.py

      # The 1-bit renditions the terminal catalogue is built from. Cheap enough
      # to rebuild every deploy — the whole catalogue is about 40 KB.
      - name: Build 1-bit renditions
        run: python tools/terminal-images.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
