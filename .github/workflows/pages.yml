name: Deploy Website

on:
  push:
    # The default branch is the live site, and there is only one of each. This
    # used to name the terminal redesign's own working branch, from back when
    # redesign/catalogue-v2 held the old catalogue and the two were publishing
    # to the same Pages site — but the redesign has since been folded into
    # redesign/catalogue-v2, that working branch is gone, and a trigger on a
    # branch that no longer exists is a site that quietly stops deploying.
    # Nothing was lost in the fold: the old catalogue's head (419c1bc) is an
    # ancestor of this branch, so it is still in this history.
    #
    # Both names are listed because the default branch is mid-rename to main.
    # Renaming it is one action in the repository's settings and it cannot be
    # done from in here, so this file has to be correct whether that has
    # happened yet or not — a trigger that is only right after somebody
    # remembers to click something is the same silent failure as the one
    # above. Drop redesign/catalogue-v2 from this list once the rename is
    # through and the old name is gone.
    branches:
      - main
      - redesign/catalogue-v2
  workflow_dispatch:

concurrency:
  group: pages-v2
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build version
        run: |
          VERSION="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD_VERSION__/$VERSION/g" sw.js
          # Same stamp on every asset URL. Hand-numbered ?v=1 strings meant a
          # deploy could change a file and nobody would ever be served it.
          grep -rl __ASSET_VERSION__ --include='*.html' . \
            | xargs -r sed -i "s/__ASSET_VERSION__/$VERSION/g"
          echo "$VERSION" > version.txt

      # Every work and every shop item gets a real page at its clean URL.
      # These used to be redirect stubs, but a redirect breaks the view
      # transition between the grid and the item — the browser cannot animate
      # across an extra navigation — so the page itself is written there.
      # Both files reference everything root-absolutely, so one copy works at
      # any depth.
      - name: Build store routes and catalogue
        run: node tools/build-routes.js

      # The catalogue is the landing screen, so the originals must never be what
      # a phone downloads. This builds WebP renditions at several widths for
      # every image. Built here rather than committed, so the derivatives
      # cannot drift from the originals and the repo does not carry two copies
      # of every painting.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache image renditions
        uses: actions/cache@v4
        with:
          path: derived
          # Renditions are named by a hash of their source, so a changed image
          # simply misses the cache and is rebuilt; the rest are reused.
          key: derived-${{ hashFiles('images/**', 'shop/**', 'tools/build-images.py') }}
          restore-keys: derived-

      - name: Build responsive images
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet Pillow numpy
          python tools/build-images.py

      # The 1-bit renditions the terminal catalogue is built from. Cheap enough
      # to rebuild every deploy — the whole catalogue is about 40 KB.
      - name: Build 1-bit renditions
        run: python tools/terminal-images.py

      # The picture each link is shown with — one 1200x630 card per work and per
      # shop item, and one for the site, drawn from the paintings themselves.
      # Reads products.json, which the route step above wrote. A few seconds.
      - name: Build share cards
        run: python tools/build-og.py

      # The sources in this repo are heavily commented on purpose — that is how
      # the thing explains itself — and every one of those comments was being
      # served to every visitor along with the code. Minified here so the
      # explanation stays in the repo and only the code goes on the wire:
      # roughly 423 KB of CSS and JS becomes 158 KB, and pixel-fx.js alone
      # drops from 128 KB to 31 KB, which is parse time on a phone as much as
      # it is transfer.
      #
      # Deliberately the last thing before the upload. Every step above reads
      # these files as sources — products.js is require()d, artworks.js is
      # sliced by hand in two places — and all of that wants the original.
      #
      # Identifiers are not renamed: esbuild leaves the top-level names of a
      # file it is not bundling alone, which is what keeps ARTWORKS, SHOP_ITEMS
      # and the window.Kritor* handles reachable across files.
      - name: Minify CSS and JS
        run: |
          npx --yes esbuild@0.25.0 *.js *.css --minify --outdir=.minified --log-level=error
          cp .minified/*.js .minified/*.css .
          rm -rf .minified

      # What is uploaded is what is public, and "." is the whole checkout: until
      # this step the payment worker's source and Cloudflare config, the build
      # tools, the READMEs and a stray icon source were all downloadable from
      # kritor.au beside the site. None of it is referenced by a page (checked
      # against the built output: the only mentions are a developer-facing
      # message string in checkout.js and comments), so it goes. This runs after
      # every step that reads those files and before the upload.
      #
      # The payment worker is deployed from backend/ with wrangler, not from the
      # site, and reads products.json, which stays.
      # Pages serves exactly what is in this folder, to the public, with no
      # step after this one that reads it. A broken link, an unfilled
      # placeholder or a page with no title stops the run here instead.
      - name: Check the built site
        run: node tools/check-site.js

      - name: Leave the project's own files out of the site
        run: |
          rm -rf backend tools scripts node_modules
          rm -f README.md shop/README.md fonts/README.md .well-known/README.md icon-source.png .gitignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
