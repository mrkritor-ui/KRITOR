<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>KRITOR</title>
<meta name="theme-color" content="#f1f0ee">
<!-- The site face, served from this origin. Preloaded rather than left to
     the stylesheet to discover: it is 4 KB, and font-display: block means
     nothing is painted in it until it lands. -->
<link rel="preload" href="/fonts/pix-chicago.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="script" href="/products.js">
<link rel="preload" as="script" href="/product.js">
<link rel="stylesheet" href="/type.css?v=__ASSET_VERSION__">
<link rel="stylesheet" href="/work.css?v=5">
<link rel="stylesheet" href="/product.css?v=4">
<link rel="stylesheet" href="/cart.css?v=4">
<link rel="stylesheet" href="/zoom.css?v=4">
<script src="/zoom-transition.js?v=3"></script>
<!-- The drawn cursor. cursor.css asks the browser for it; cursor.js draws
     it, which is the half that cannot be silently declined. -->
<link rel="stylesheet" href="/cursor.css?v=__ASSET_VERSION__">
<script src="/cursor.js?v=__ASSET_VERSION__" defer></script>
</head>
<body>
<header class="work-header">
  <a href="/store/" aria-label="Back to store">+</a>
  <span class="work-header-bag" data-bag-slot></span>
</header>
<main id="product-page"></main>
<script src="/products.js"></script>
<script src="/image-manifest.js"></script>
<script src="/tile-image.js?v=1"></script>
<script src="/cart.js"></script>
<script src="/product.js"></script>
<script>
/* /shop/<id>/ redirects here to resolve on a static host; put the clean URL
   back so the address bar and any share match the route the customer clicked. */
(function(){
  var id=new URLSearchParams(location.search).get('id');
  if(id&&/^[a-z0-9][a-z0-9-]*$/.test(id)){
    history.replaceState(history.state,'','/shop/'+encodeURIComponent(id)+'/');
  }
})();
</script>
</body>
</html>
