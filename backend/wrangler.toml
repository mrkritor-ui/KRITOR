name = "kritor-payments"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# The origin serving products.json — your live KRITOR site.
SITE_ORIGIN = "https://kritor.au"

# Origins allowed to call this worker. Include every host the store is served
# from, comma separated, no trailing slashes. www is listed because GitHub
# Pages answers on both names, and CORS matches the origin exactly.
ALLOWED_ORIGINS = "https://kritor.au,https://www.kritor.au"

# STRIPE_SECRET_KEY is NOT set here — it is a secret:
#   npx wrangler secret put STRIPE_SECRET_KEY

# Flood protection for the public endpoints. namespace_id is just a local
# identifier for this counter — it is not a secret and not looked up anywhere.
# period must be 10 or 60 (seconds).
[[ratelimits]]
name = "CHECKOUT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
