<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About — KRITOR</title>
<link rel="stylesheet" href="about.css">
</head>
<body>
<main class="about-page">
  <a class="catalogue" href="index.html?return=catalogue" aria-label="Back to catalogue">+</a>
  <div class="about-text">
    <p>ABOUT THE ARTIST, THE WORK, THE PRACTICE, AND THE KRITOR PROJECT</p>
    <p>[KRITOR MAKES THINGS, A CHOICE MADE AT 17 TO NOT TAKE TIME FOR GRANTED.]</p>
  </div>
</main>
<script>
(function(){
  const page=document.querySelector('.about-page');
  const back=document.querySelector('.catalogue');
  if(!page||!back)return;

  back.addEventListener('click',function(e){
    e.preventDefault();
    if(document.documentElement.classList.contains('is-leaving'))return;
    document.documentElement.classList.add('is-leaving');
    page.classList.add('is-leaving');
    setTimeout(function(){window.location.href=back.href},520);
  });
})();
</script>
</body>
</html>
