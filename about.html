<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About — KRITOR</title>
<link rel="stylesheet" href="about.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<main class="about-page">
  <a class="catalogue" href="index.html" aria-label="Back to catalogue">+</a>
  <div class="about-text">
    <p>ABOUT THE ARTIST, THE WORK, THE PRACTICE, AND THE KRITOR PROJECT</p>
    <p>[KRITOR MAKES THINGS, A CHOICE MADE AT 17 TO NOT TAKE TIME FOR GRANTED.]</p>
  </div>
</main>
<script src="transitions.js"></script>
<script>
(function(){
  const page=document.querySelector('.about-page');
  const back=document.querySelector('.catalogue');
  if(!page||!back)return;

  /* Kept only as a safety net for browsers where transitions.js cannot load.
     Modern browsers use the native cross-document View Transition instead. */
  if(!window.CSS || !CSS.supports || !CSS.supports('view-transition-name: root')){
    back.addEventListener('click',function(e){
      e.preventDefault();
      if(document.documentElement.classList.contains('kritor-fallback-leaving'))return;
      document.documentElement.classList.add('kritor-fallback-leaving');
      setTimeout(function(){window.location.href=back.href},520);
    });
  }
})();
</script>
</body>
</html>
